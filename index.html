<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <script>
    // Upgrade http:// subresources only when served over https; plain-http
    // viewers (e.g. local testing against http://localhost registers) are left alone.
    if (location.protocol === 'https:') {
      var csp = document.createElement('meta');
      csp.httpEquiv = 'Content-Security-Policy';
      csp.content = 'upgrade-insecure-requests';
      document.head.appendChild(csp);
    }
  </script>
  <link rel="icon" href="/favicon.ico" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OGC Location Building Blocks</title>
</head>

<body>
  <div id="app"></div>
  <script type="module" src="/src/main.js"></script>
</body>

</html>
